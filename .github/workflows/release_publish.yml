name: Release Publish

# Publish prebuilt redis-cli binaries and the install script to S3. The binaries
# are downloaded from the build run referenced by release_handle (run_id); they
# are not rebuilt here.
#
#   release_type=internal -> staging bucket
#   release_type=public   -> production bucket, served at https://packages.redis.io
#
# A per-environment IAM role is assumed via OIDC (no long-lived credentials).
#
# Required repository secrets:
#   CLI_S3_IAM_ARN[_STAGING]   IAM role to assume            (public / internal)
#   CLI_S3_BUCKET[_STAGING]    target bucket                 (public / internal)
#   CLI_S3_REGION[_STAGING]    bucket region                 (public / internal)
#   SLACK_WEB_HOOK_URL         optional; release notifications

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Redis version/tag to publish (e.g. 8.8.0). Defaults to .redis_version.'
        required: false
      release_type:
        description: 'Where to publish'
        type: choice
        options: [internal, public]
        default: internal
      workflow_uuid:
        description: 'Optional UUID to identify this workflow run (used by release automation)'
        required: false
      release_handle:
        description: 'JSON from the Release Build and Test run; provides run_id of the built artifacts.'
        required: true
      make_latest:
        description: "Move the stable/latest pointers to this version (works for internal too, so staging can rehearse it)"
        type: boolean
        default: false

run-name: "Release Publish${{ inputs.workflow_uuid && format(': {0}', inputs.workflow_uuid) || '' }}"

permissions:
  contents: read
  actions: read     # download artifacts from the build run
  id-token: write   # for AWS OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.handle.outputs.release_tag || steps.v.outputs.release_tag }}
      smoke_targets: ${{ steps.parse.outputs.SMOKE_TEST_ARCHES }}
    steps:
      - uses: actions/checkout@v5

      - name: Parse env file
        id: parse
        uses: ./.github/actions/parse-env-file

      - name: Parse release handle
        id: handle
        uses: ./.github/actions/parse-release-handle
        with:
          release_handle: ${{ inputs.release_handle }}

      - name: Resolve release tag
        id: v
        run: |
          TAG="${{ inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="${{ steps.handle.outputs.release_tag }}"
          [ -n "$TAG" ] || TAG="$(cat .redis_version)"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      # Verify the release branch exists; do not modify it.
      - name: Ensure Release Branch
        uses: redis-developer/redis-oss-release-automation/.github/actions/ensure-release-branch@main
        with:
          release_tag: ${{ steps.v.outputs.release_tag }}
          allow_modify: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      # Download the binaries produced by the build run (no rebuild).
      - uses: actions/download-artifact@v7
        with:
          run-id: ${{ steps.handle.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist-all

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find dist-all -type f -name 'redis-cli-*' -exec cp {} dist/ \;
          ls -l dist
          ls dist/redis-cli-* >/dev/null 2>&1 || { echo "no redis-cli-* artifacts in build run ${{ steps.handle.outputs.run_id }}"; exit 1; }

      # Assume the per-environment IAM role via OIDC.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.release_type == 'public' && secrets.CLI_S3_IAM_ARN || secrets.CLI_S3_IAM_ARN_STAGING }}
          aws-region: ${{ inputs.release_type == 'public' && secrets.CLI_S3_REGION || secrets.CLI_S3_REGION_STAGING }}

      - name: Publish to S3
        id: pub
        env:
          # packages.redis.io is a CDN in front of the prod bucket, not its S3
          # endpoint, so it can't be derived. Staging is served directly from S3.
          PUBLIC_BASE_URL: https://packages.redis.io
          PREFIX: redis-cli
          BUCKET: ${{ inputs.release_type == 'public' && secrets.CLI_S3_BUCKET || secrets.CLI_S3_BUCKET_STAGING }}
          REGION: ${{ inputs.release_type == 'public' && secrets.CLI_S3_REGION || secrets.CLI_S3_REGION_STAGING }}
        run: |
          if [ "${{ inputs.release_type }}" = "public" ]; then
            BASE_URL="$PUBLIC_BASE_URL"
          else
            BASE_URL="https://${BUCKET}.s3.${REGION}.amazonaws.com"
          fi
          MAKE_LATEST=""
          if [ "${{ inputs.release_type }}" = "public" ] || [ "${{ inputs.make_latest }}" = "true" ]; then
            MAKE_LATEST="--make-latest"
          fi
          echo "Publishing release_type=${{ inputs.release_type }} bucket=$BUCKET base=$BASE_URL prefix=$PREFIX"
          ./publish.sh \
            --version "${{ steps.v.outputs.release_tag }}" \
            --bucket "$BUCKET" \
            --base-url "$BASE_URL" \
            --prefix "$PREFIX" \
            --dist dist \
            $MAKE_LATEST

      # Record the publish outcome for the release orchestrator to read.
      - name: Write release_info
        run: |
          artifacts=$(cd dist && ls redis-cli-"${{ steps.v.outputs.release_tag }}"-* 2>/dev/null \
            | grep -v '\.sha256$' | jq -R . | jq -sc .)
          cat > result.json <<JSON
          {
            "release_tag": "${{ steps.v.outputs.release_tag }}",
            "release_type": "${{ inputs.release_type }}",
            "run_id": ${{ github.run_id }},
            "prefix": "redis-cli",
            "artifacts": ${artifacts:-[]}
          }
          JSON
          cat result.json

      - uses: actions/upload-artifact@v6
        with:
          name: release_info
          path: result.json
          retention-days: 90

  # Validate the just-published artifacts install and run across many distros.
  smoke-test:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.publish.outputs.smoke_targets) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Run smoke tests
        uses: ./.github/actions/run-smoke-tests
        with:
          arch: ${{ matrix.arch }}
          version: ${{ needs.publish.outputs.release_tag }}
          base_url: ${{ inputs.release_type == 'public' && 'https://packages.redis.io/redis-cli' || format('https://{0}.s3.{1}.amazonaws.com/redis-cli', secrets.CLI_S3_BUCKET_STAGING, secrets.CLI_S3_REGION_STAGING) }}

  slack-notification:
    needs: [publish, smoke-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v5
      - name: Notify result
        uses: ./.github/actions/slack-notification
        with:
          slack_func: ${{ (needs.publish.result == 'success' && needs.smoke-test.result == 'success') && 'slack_format_success_message' || 'slack_format_failure_message' }}
          release_tag: ${{ needs.publish.outputs.release_tag }}
          env: ${{ inputs.release_type == 'public' && 'production' || 'staging' }}
          base_url: ${{ inputs.release_type == 'public' && 'https://packages.redis.io/redis-cli' || format('https://{0}.s3.{1}.amazonaws.com/redis-cli', secrets.CLI_S3_BUCKET_STAGING, secrets.CLI_S3_REGION_STAGING) }}
          message: ":x: redis-cli publish failed"
          SLACK_WEB_HOOK_URL: ${{ secrets.SLACK_WEB_HOOK_URL }}
